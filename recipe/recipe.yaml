schema_version: 1

context:
  version: "2.12.1"
  python_min: "3.10"

recipe:
  name: hist-suite
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/c2/30/852cb9ea359c44055f9655025bf4bb30d447fec541baa91cdde974083171/hist-${{ version }}.tar.gz
  sha256: 726e61e6c9594bed284bb3ab7caac1623872a9c6dc91eb15ed28ad66ba84bb03

build:
  number: 0

outputs:
  - package:
      name: hist-base

    build:
      noarch: python
      script: ${{ PYTHON }} -m pip install . -vv
      python:
        entry_points:
          - hist=hist.classichist:main

    requirements:
      host:
        - python ${{ python_min }}.*
        - pip
        - hatchling
        - hatch-vcs
      run:
        - python >=${{ python_min }}
        - boost-histogram >=1.7,<1.9
        - histoprint >=2.2
        - numpy >=1.21.3
        - packaging >=23.0
        # Actually only required for [py<311] but require for all Python versions so this can be noarch: python
        - typing-extensions >=4

    tests:
      - python:
          imports:
            - hist
            - hist.axis
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"

  - package:
      name: hist

    build:
      noarch: python

    requirements:
      # Satisfy linter but not used
      host:
        - python ${{ python_min }}.*
      run:
        - ${{ pin_subpackage('hist-base', exact=True) }}
        # The plot requirements
        - matplotlib-base >=3.10.7
        - mplhep >=0.3.33
        # The fit plot requirements
        - scipy >=1.7
        - iminuit >=2.9
        # Satisfy linter but not used
        - python >=${{ python_min }}

    tests:
      - python:
          imports:
            - hist
            - hist.axis
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"

about:
  summary: Hist classes and utilities
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/scikit-hep/hist
  repository: https://github.com/scikit-hep/hist
  documentation: https://hist.readthedocs.io/

extra:
  feedstock-name: hist
  recipe-maintainers:
    - conda-forge/scikit-hep
    - LovelyBuggies
